# @package _global_
# High Reynolds number cape flow

qg:
  grid:
    Nx: 1024
    Ny: 512
    Lx: 12.566370614359172  # 4*pi
    Ly: 6.283185307179586   # 2*pi
    precision: float32

  time:
    dt: 0.005
    T: 24
    save_rate: 100

  pde:
    nu: 0.0005  # RE 2000
    mu: 0.0
    B: 0.0
    nv: 1
    penalty: 2.0

  ic:
    function: randn
    energy: 0.0005
    wavenumbers: [1.0, 3.0]
    n_batch: 1

  forcing: null

  mask:
    function: cape
    pad: 0.3

  bc:
    function: const-outlet-vorticity-rtd
    width: 0.1
    sponge: 4.0
