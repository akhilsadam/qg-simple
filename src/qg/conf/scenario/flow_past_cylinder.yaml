# @package _global_
# Flow past cylinder scenario

qg:
  grid:
    Nx: 256
    Ny: 256
    Lx: 6.283185307179586
    Ly: 6.283185307179586
    precision: float32

  time:
    dt: 0.001 #05
    T: 24
    save_rate: 500

  pde:
    nu: 5e-3 #1.025e-5 # RE 200
    penalty: 1.25  # Brinkman penalty for obstacle

  ic:
    function: randn
    energy: 0

  forcing: null

  mask:
    function: circular
    r: 0.628318530717959  # pi/5
    x_center: 0.25  # Position cylinder at 1/4 domain
    y_center: 0.5

  bc:
    function: const-outlet-vorticity-r
    width: 0.1
    sponge: 3.25

  flow:
    function: const-x-flow
    inlet_velocity: 1.0
