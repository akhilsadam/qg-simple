# @package _global_
# Flow past cylinder scenario

qg:
  grid:
    Nx: 256
    Ny: 256
    Lx: 6.283185307179586
    Ly: 6.283185307179586
    precision: float32

  time:
    dt: 0.0005
    T: 120
    save_rate: 500

  pde:
    nu: 1.025e-5  #0.005  # RE 200
    mu: 0.0
    B: 0.0
    nv: 1
    penalty: 1.25  # Brinkman penalty for obstacle

  ic:
    function: randn
    energy: 0.0005
    wavenumbers: [1.0, 3.0]
    n_batch: 1

  forcing: null

  # mask:
  #   function: fpc  # Flow past cylinder
  #   r: 0.7853981633974483  # pi/4

  bc:
    function: const-outlet-vorticity-r
    width: 0.1
    sponge: 1.25
    inlet_velocity: 1.0
