# @package _global_
# Decaying turbulence scenario (no forcing, no obstacles)

qg:
  grid:
    Nx: 128
    Ny: 128
    precision: float64
  
  time:
    dt: 0.0001
    T: 10
    save_rate: 1000
  
  pde:
    nu: 1.025e-2  # Viscosity
  
  ic:
    n_batch: 1
    energy: 0.1
    wavenumbers: [3.0, 5.0]
  
  forcing: null  # No forcing
  mask: null     # No obstacles

